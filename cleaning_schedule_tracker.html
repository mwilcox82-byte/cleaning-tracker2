<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaning Schedule Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 12px;
            font-size: 28px;
        }

        .cycle-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .cycle-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .cycle-button:hover {
            background: #5568d3;
        }

        .progress-container {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .progress-bar {
            flex: 1;
            min-width: 150px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            white-space: nowrap;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .day-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }

        .day-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .day-time {
            font-size: 12px;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
            color: #666;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .location-group {
            margin-top: 12px;
        }

        .location-name {
            font-size: 12px;
            font-weight: 700;
            color: #764ba2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 10px;
            background: #f9f9f9;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .task-item:hover {
            background: #f0f0f0;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: white;
            transition: all 0.2s ease;
        }

        .task-item.completed .checkbox {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .checkbox::after {
            content: '✓';
            font-size: 12px;
            font-weight: bold;
        }

        .task-text {
            flex: 1;
            font-size: 14px;
            color: #333;
            line-height: 1.4;
        }

        .as-needed {
            font-size: 11px;
            background: #fff3cd;
            color: #856404;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: auto;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-reset {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-reset:hover {
            background: #f5c6cb;
        }

        .summary {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .summary-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #666;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-value {
            font-weight: 600;
            color: #333;
        }

        @media (max-width: 600px) {
            header {
                padding: 16px;
            }

            h1 {
                font-size: 22px;
            }

            .cycle-info {
                flex-direction: column;
                gap: 12px;
            }

            .progress-container {
                width: 100%;
            }

            .progress-bar {
                flex: 1;
            }

            .schedule-grid {
                grid-template-columns: 1fr;
            }

            .day-header {
                flex-wrap: wrap;
            }

            .day-time {
                flex-basis: 100%;
                margin-top: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧹 Cleaning Schedule Tracker</h1>
            <div class="cycle-info">
                <div>
                    <div style="font-size: 14px; color: #666; margin-bottom: 4px;">Current Cycle</div>
                    <div style="font-size: 20px; font-weight: 700; color: #333;" id="currentCycle">Cycle 1</div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">0/0 tasks</div>
                </div>
                <button class="cycle-button" onclick="nextCycle()">Next Cycle →</button>
            </div>
        </header>

        <div class="schedule-grid" id="scheduleGrid"></div>

        <div class="controls">
            <button class="btn btn-primary" onclick="saveToFile()">📥 Export Progress</button>
            <button class="btn btn-secondary" onclick="markAllCompleted()">✓ Mark All Done</button>
            <button class="btn btn-reset" onclick="resetCurrentCycle()">🔄 Reset This Cycle</button>
        </div>

        <div class="summary">
            <div class="summary-title">Cycle Summary</div>
            <div class="summary-item">
                <span>Total Tasks (This Cycle):</span>
                <span class="summary-value" id="totalTasks">0</span>
            </div>
            <div class="summary-item">
                <span>Completed:</span>
                <span class="summary-value" id="completedTasks">0</span>
            </div>
            <div class="summary-item">
                <span>Remaining:</span>
                <span class="summary-value" id="remainingTasks">0</span>
            </div>
            <div class="summary-item">
                <span>Est. Time Remaining:</span>
                <span class="summary-value" id="timeRemaining">0 min</span>
            </div>
            <div class="summary-item">
                <span>Next Cycle Due:</span>
                <span class="summary-value" id="nextCycleDue">14 days</span>
            </div>
        </div>
    </div>

    <script>
        const SCHEDULE = {
            cycle1: {
                day1: {
                    title: "Cycle Day 1",
                    time: "~1.5 hours",
                    tasks: [
                        { location: "2nd Floor", name: "Wash bed linens", duration: 20, asNeeded: false },
                        { location: "2nd Floor", name: "Dust and clean surfaces", duration: 15, asNeeded: false },
                        { location: "2nd Floor", name: "Sweep/vacuum floor", duration: 15, asNeeded: false },
                        { location: "2nd Floor", name: "Mop floors", duration: 15, asNeeded: false },
                        { location: "2nd Floor", name: "Clean windows", duration: 10, asNeeded: false },
                        { location: "2nd Floor", name: "Organize wardrobe", duration: 10, asNeeded: false },
                        { location: "2nd Floor", name: "Clean terraces (as needed)", duration: 15, asNeeded: true },
                    ]
                },
                day2: {
                    title: "Cycle Day 2",
                    time: "~1.5 hours",
                    tasks: [
                        { location: "Stairs & Misc", name: "Vacuum stairs", duration: 10, asNeeded: false },
                        { location: "Stairs & Misc", name: "Clean stair rails", duration: 5, asNeeded: false },
                        { location: "Stairs & Misc", name: "Water, fertilize, and prune plants (as needed)", duration: 15, asNeeded: true },
                        { location: "Stairs & Misc", name: "Note and plan for any repairs needed", duration: 5, asNeeded: true },
                        { location: "Stairs & Misc", name: "Replenish cleaning supplies (as needed)", duration: 10, asNeeded: true },
                        { location: "1st Floor Office", name: "Organize work desk", duration: 10, asNeeded: false },
                        { location: "1st Floor Office", name: "Dust and clean surface", duration: 10, asNeeded: false },
                        { location: "1st Floor Office", name: "Sweep/vacuum floor", duration: 10, asNeeded: false },
                        { location: "1st Floor Office", name: "Clean window", duration: 8, asNeeded: false },
                        { location: "1st Floor Office", name: "Mop floor", duration: 10, asNeeded: false },
                    ]
                },
                day3: {
                    title: "Cycle Day 3",
                    time: "~2 hours",
                    tasks: [
                        { location: "1st Floor Bathroom", name: "Clean all surfaces", duration: 15, asNeeded: false },
                        { location: "1st Floor Bathroom", name: "Replace toilet paper and toilet bowl cleaner (as needed)", duration: 5, asNeeded: true },
                        { location: "1st Floor Bathroom", name: "Wash/replace towels (as needed)", duration: 10, asNeeded: true },
                        { location: "1st Floor Bathroom", name: "Mop floor", duration: 10, asNeeded: false },
                        { location: "1st Floor Bathroom", name: "Empty garbage", duration: 3, asNeeded: false },
                        { location: "1st Floor Bathroom", name: "Clean mirror", duration: 5, asNeeded: false },
                        { location: "1st Floor Bathroom", name: "Refill air/toilet fresheners (as needed)", duration: 3, asNeeded: true },
                        { location: "1st Floor Bathroom", name: "Refill hand soap (as needed)", duration: 2, asNeeded: true },
                        { location: "1st Floor Guest Room", name: "Dust and clean surfaces", duration: 10, asNeeded: false },
                        { location: "1st Floor Guest Room", name: "Clean windows", duration: 8, asNeeded: false },
                        { location: "1st Floor Guest Room", name: "Sweep/vacuum floor", duration: 10, asNeeded: false },
                        { location: "1st Floor Guest Room", name: "Mop floor", duration: 10, asNeeded: false },
                    ]
                }
            },
            cycle2: {
                day1: {
                    title: "Cycle Day 1",
                    time: "~2 hours",
                    tasks: [
                        { location: "Ground Floor WC", name: "Clean all surfaces", duration: 15, asNeeded: false },
                        { location: "Ground Floor WC", name: "Replace toilet paper and toilet bowl cleaner (as needed)", duration: 5, asNeeded: true },
                        { location: "Ground Floor WC", name: "Wash/replace hand towel (as needed)", duration: 5, asNeeded: true },
                        { location: "Ground Floor WC", name: "Mop floor", duration: 10, asNeeded: false },
                        { location: "Ground Floor WC", name: "Empty garbage", duration: 3, asNeeded: false },
                        { location: "Ground Floor WC", name: "Clean mirror", duration: 5, asNeeded: false },
                        { location: "Ground Floor WC", name: "Clean window", duration: 8, asNeeded: false },
                        { location: "Ground Floor WC", name: "Refill air freshener cannister and batteries (as needed)", duration: 5, asNeeded: true },
                        { location: "Ground Floor WC", name: "Refill air/toilet fresheners (as needed)", duration: 3, asNeeded: true },
                        { location: "Ground Floor WC", name: "Refill hand soap (as needed)", duration: 2, asNeeded: true },
                        { location: "Ground Floor Kitchen", name: "Clean all surfaces", duration: 20, asNeeded: false },
                        { location: "Ground Floor Kitchen", name: "Load/unload dishwasher (as needed)", duration: 5, asNeeded: true },
                        { location: "Ground Floor Kitchen", name: "Clean all appliances", duration: 15, asNeeded: false },
                        { location: "Ground Floor Kitchen", name: "Sweep/vacuum floor", duration: 10, asNeeded: false },
                    ]
                },
                day2: {
                    title: "Cycle Day 2",
                    time: "~2 hours",
                    tasks: [
                        { location: "Ground Floor Kitchen", name: "Mop floors", duration: 10, asNeeded: false },
                        { location: "Ground Floor Kitchen", name: "Clean window", duration: 8, asNeeded: false },
                        { location: "Ground Floor Kitchen", name: "Empty garbage and recycling (as needed)", duration: 5, asNeeded: true },
                        { location: "Ground Floor Living/Dining/Entry", name: "Clean all surfaces", duration: 15, asNeeded: false },
                        { location: "Ground Floor Living/Dining/Entry", name: "Sweep/vacuum floor", duration: 15, asNeeded: false },
                        { location: "Ground Floor Living/Dining/Entry", name: "Mop floors", duration: 15, asNeeded: false },
                        { location: "Ground Floor Living/Dining/Entry", name: "Wash pillow cushions/carpet (as needed)", duration: 20, asNeeded: true },
                        { location: "Ground Floor Living/Dining/Entry", name: "Clean couch and chairs (as needed)", duration: 20, asNeeded: true },
                        { location: "Ground Floor Living/Dining/Entry", name: "Clean windows", duration: 10, asNeeded: false },
                        { location: "Entrance/Storage", name: "Remove weeds (as needed)", duration: 10, asNeeded: true },
                        { location: "Entrance/Storage", name: "Sweep entrance tiles and paved area", duration: 10, asNeeded: false },
                        { location: "Entrance/Storage", name: "Sweep and mop storage room floor", duration: 15, asNeeded: false },
                        { location: "Entrance/Storage", name: "Clean appliances as needed (washing machine, dryer, etc)", duration: 20, asNeeded: true },
                    ]
                },
                day3: {
                    title: "Cycle Day 3",
                    time: "~1 hour",
                    tasks: [
                        { location: "Ground Floor Terrace", name: "Sweep tiles", duration: 15, asNeeded: false },
                        { location: "Ground Floor Terrace", name: "Power wash tiles (as needed)", duration: 30, asNeeded: true },
                        { location: "Ground Floor Terrace", name: "Trim plant overgrowth (as needed)", duration: 15, asNeeded: true },
                        { location: "Ground Floor Terrace", name: "Clean all surfaces", duration: 10, asNeeded: false },
                        { location: "Ground Floor Terrace", name: "Clean windows", duration: 10, asNeeded: false },
                        { location: "Miscellaneous", name: "Clean and organize crawl/storage space (as needed)", duration: 30, asNeeded: true },
                        { location: "Miscellaneous", name: "Note any spot cleaning and treatment of wood floors needed", duration: 5, asNeeded: true },
                    ]
                }
            }
        };

        let currentState = {
            cycle: 1,
            completed: {}
        };

        function initializeApp() {
            loadState();
            renderSchedule();
            updateProgress();
        }

        function loadState() {
            const saved = localStorage.getItem('cleaningTrackerState');
            if (saved) {
                currentState = JSON.parse(saved);
            }
        }

        function saveState() {
            localStorage.setItem('cleaningTrackerState', JSON.stringify(currentState));
            updateProgress();
        }

        function renderSchedule() {
            const cycleKey = `cycle${currentState.cycle}`;
            const cycle = SCHEDULE[cycleKey];
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = '';

            Object.keys(cycle).forEach(dayKey => {
                const day = cycle[dayKey];
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';

                const header = document.createElement('div');
                header.className = 'day-header';
                header.innerHTML = `
                    <div class="day-title">${day.title}</div>
                    <div class="day-time">${day.time}</div>
                `;
                dayCard.appendChild(header);

                const tasksList = document.createElement('div');
                tasksList.className = 'tasks-list';

                let currentLocation = '';
                day.tasks.forEach((task, idx) => {
                    const taskId = `${cycleKey}-${dayKey}-${idx}`;
                    const isCompleted = currentState.completed[taskId] || false;

                    if (task.location !== currentLocation) {
                        currentLocation = task.location;
                        const locationName = document.createElement('div');
                        locationName.className = 'location-name';
                        locationName.textContent = task.location;
                        tasksList.appendChild(locationName);
                    }

                    const taskItem = document.createElement('div');
                    taskItem.className = `task-item ${isCompleted ? 'completed' : ''}`;
                    taskItem.innerHTML = `
                        <div class="checkbox"></div>
                        <div class="task-text">${task.name}</div>
                        ${task.asNeeded ? '<div class="as-needed">as needed</div>' : ''}
                    `;
                    taskItem.onclick = () => toggleTask(taskId);
                    tasksList.appendChild(taskItem);
                });

                dayCard.appendChild(tasksList);
                grid.appendChild(dayCard);
            });

            document.getElementById('currentCycle').textContent = `Cycle ${currentState.cycle}`;
        }

        function toggleTask(taskId) {
            currentState.completed[taskId] = !currentState.completed[taskId];
            saveState();
            renderSchedule();
        }

        function updateProgress() {
            const cycleKey = `cycle${currentState.cycle}`;
            const cycle = SCHEDULE[cycleKey];
            let total = 0;
            let completed = 0;
            let totalDuration = 0;

            Object.keys(cycle).forEach(dayKey => {
                cycle[dayKey].tasks.forEach((task, idx) => {
                    total++;
                    const taskId = `${cycleKey}-${dayKey}-${idx}`;
                    if (currentState.completed[taskId]) {
                        completed++;
                    }
                    totalDuration += task.duration;
                });
            });

            const remaining = total - completed;
            const progressPercent = total > 0 ? (completed / total) * 100 : 0;

            document.getElementById('progressFill').style.width = progressPercent + '%';
            document.getElementById('progressText').textContent = `${completed}/${total} tasks`;
            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('remainingTasks').textContent = remaining;

            // Estimate time remaining (approximate 1.5 min per task that isn't "as needed" only)
            const timePerTask = 2; // Conservative estimate
            const timeRemaining = remaining * timePerTask;
            document.getElementById('timeRemaining').textContent = Math.max(0, Math.round(timeRemaining)) + ' min';
        }

        function nextCycle() {
            currentState.cycle = currentState.cycle === 1 ? 2 : 1;
            currentState.completed = {};
            saveState();
            renderSchedule();
            updateProgress();
        }

        function markAllCompleted() {
            const cycleKey = `cycle${currentState.cycle}`;
            const cycle = SCHEDULE[cycleKey];

            Object.keys(cycle).forEach(dayKey => {
                cycle[dayKey].tasks.forEach((task, idx) => {
                    const taskId = `${cycleKey}-${dayKey}-${idx}`;
                    currentState.completed[taskId] = true;
                });
            });

            saveState();
            renderSchedule();
        }

        function resetCurrentCycle() {
            if (confirm('Are you sure? This will reset all tasks for this cycle.')) {
                const cycleKey = `cycle${currentState.cycle}`;
                const cycle = SCHEDULE[cycleKey];

                Object.keys(cycle).forEach(dayKey => {
                    cycle[dayKey].tasks.forEach((task, idx) => {
                        const taskId = `${cycleKey}-${dayKey}-${idx}`;
                        delete currentState.completed[taskId];
                    });
                });

                saveState();
                renderSchedule();
            }
        }

        function saveToFile() {
            const cycleKey = `cycle${currentState.cycle}`;
            const cycle = SCHEDULE[cycleKey];
            let total = 0, completed = 0;

            Object.keys(cycle).forEach(dayKey => {
                cycle[dayKey].tasks.forEach((task, idx) => {
                    total++;
                    const taskId = `${cycleKey}-${dayKey}-${idx}`;
                    if (currentState.completed[taskId]) completed++;
                });
            });

            const data = `
Cleaning Schedule Progress
==========================
Date: ${new Date().toLocaleDateString()}
Cycle: ${currentState.cycle}
Completed: ${completed}/${total} tasks (${Math.round((completed/total)*100)}%)

${Object.keys(cycle).map(dayKey => {
                const day = cycle[dayKey];
                const tasks = day.tasks.map((task, idx) => {
                    const taskId = `${cycleKey}-${dayKey}-${idx}`;
                    const status = currentState.completed[taskId] ? '✓' : '○';
                    return `  ${status} ${task.name}`;
                }).join('\n');
                return `${day.title} (${day.time})\n${tasks}`;
            }).join('\n\n')}
            `;

            const blob = new Blob([data], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cleaning-progress-cycle${currentState.cycle}-${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
        }

        // Initialize on load
        initializeApp();
    </script>
</body>
</html>
